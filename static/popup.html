<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Change extension settings</title>
    <link rel="stylesheet" href="popup/common.css">
    <link rel="stylesheet" href="popup/dev-notes.css">
    <link rel="stylesheet" href="popup/scoped-options.css">
</head>

<body>
    <div id="cr-dual-subs-dev-notes">
        <div class="dev-notes">
            <div>
                <input id="dev-notes-checkbox" type="checkbox" checked />
                <label for="dev-notes-checkbox">Dev notes</label>
            </div>
            <span id="notes-count" data-notes="0">new notes</span>
        </div>
        <div class="side-by-side" collapsed="true">
            <div class="notes-list scroll-down-arrow">
                <div class="note" role="button" data-new="true">
                    <span>Title</span>
                    <p>Message that is very very very very very very very very very very very very very very very very
                        very very very very long</p>
                </div>
                <div class="note" role="button">
                    <span>Title</span>
                    <p>Message...</p>
                </div>
                <div class="note" role="button">
                    <span>Title</span>
                    <p>Message...</p>
                </div>
            </div>
            <div class="note-detail">
            </div>
        </div>
    </div>
    <div id="loading-state">Loading settings...</div>
    <div id="stream-limit-notice" hidden></div>

    <div id="cr-dual-subs-overlay-options">
        <div class="profile-display">
            <span>Overlay options</span>
            <span id="profile-select">N/A</span>
        </div>

        <div class="scope-block" collapsed="false">
            <fieldset id="scope-select" class="segmented-control">
                <input type="radio" name="scope" id="scope-global" value="global" checked>
                <label for="scope-global">Global<span class="hint">(overridden by season)</span></label>

                <input type="radio" name="scope" id="scope-season" value="season">
                <label for="scope-season">Current Season<span class="hint">(overridden by episode)</span></label>

                <input type="radio" name="scope" id="scope-episode" value="episode">
                <label for="scope-episode">Current Episode<span class="hint">(SLUG HERE)</span></label>
            </fieldset>

            <div class="settings-block">
                <label>
                    Preferred secondary subtitle
                    <select id="subtitle-select"></select>
                </label>

                <div class="field">
                    <label for="primary-offset-input">Primary subtitle time offset</label>
                    <div class="inline-field">
                        <input id="primary-offset-input" type="number" step="0.05" value="0" />
                        <span>seconds</span>
                    </div>
                </div>

                <div class="field">
                    <label for="secondary-offset-input">Secondary subtitle time offset</label>
                    <div class="inline-field">
                        <input id="secondary-offset-input" type="number" step="0.05" value="0" />
                        <span>seconds</span>
                    </div>
                </div>

                <button id="reset-position-button">Reset subtitle position</button>
            </div>
        </div>
    </div>
    <footer>
        <a href="https://github.com/AndyNoob/crunchyroll-dual-subs/" target="_blank">SOURCE ↗</a>
        <span>|</span>
        <a href="https://github.com/AndyNoob/crunchyroll-dual-subs/issues" target="_blank">REPORT PROBLEMS ↗</a>
    </footer>
    <template id="note-template">
        <div class="note" role="button">
            <span>Title</span>
            <p></p>
        </div>
    </template>
    <template id="note-detail-template">
        <div>
            <div class="note-detail-header">
                <button class="back-button">←</button>
                <span class="note-detail-date">Jun 1, 2026</span>
            </div>
            <div class="note-detail-title">Sample dev note</div>
            <div class="note-detail-body">VERY INTERSTING TEXT</div>
        </div>
    </template>
    <script src="../src/ui/popup/common.ts" type="module"></script>
    <script src="../src/ui/popup/scoped-options.ts" type="module"></script>
    <script src="../src/ui/popup/dev-note.ts" type="module"></script>
</body>

</html>
